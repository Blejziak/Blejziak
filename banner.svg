<svg xmlns="http://www.w3.org/2000/svg" width="880" height="300" viewBox="0 0 880 300" role="img" aria-label="kacper@blejziak — Bot Developer · Web Developer">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d0e12"/>
      <stop offset="0.6" stop-color="#100f1d"/>
      <stop offset="1" stop-color="#151329"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.15" r="0.85">
      <stop offset="0" stop-color="#6C63FF" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#6C63FF" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="row1"><rect x="90" y="110" width="0" height="34"><animate attributeName="width" from="0" to="150" dur="0.5s" begin="0.3s" fill="freeze"/></rect></clipPath>
    <clipPath id="row2"><rect x="90" y="142" width="0" height="34"><animate attributeName="width" from="0" to="700" dur="0.9s" begin="1s" fill="freeze"/></rect></clipPath>
    <clipPath id="row3"><rect x="90" y="174" width="0" height="34"><animate attributeName="width" from="0" to="560" dur="0.8s" begin="2s" fill="freeze"/></rect></clipPath>
  </defs>

  <rect width="880" height="300" fill="url(#bgGrad)"/>
  <rect width="880" height="300" fill="url(#glow)"/>

  <!-- okno terminala -->
  <rect x="60" y="40" width="760" height="220" rx="12" fill="#131320" stroke="#262a3d" stroke-width="1.5"/>
  <rect x="57" y="37" width="766" height="226" rx="15" fill="none" stroke="#6C63FF" stroke-opacity="0.22" stroke-width="3"/>

  <!-- pasek tytułu -->
  <circle cx="88" cy="66" r="6" fill="#ff5f56"/>
  <circle cx="108" cy="66" r="6" fill="#ffbd2e"/>
  <circle cx="128" cy="66" r="6" fill="#27c93f"/>
  <text x="440" y="70" text-anchor="middle" font-family="Consolas, 'Cascadia Code', monospace" font-size="12" fill="#6b7280">kacper@blejziak — zsh</text>
  <line x1="60" y1="84" x2="820" y2="84" stroke="#262a3d"/>

  <!-- wiersze „wpisywane” po kolei -->
  <g font-family="'JetBrains Mono', Consolas, 'Cascadia Code', monospace" font-size="15">
    <g clip-path="url(#row1)">
      <text x="90" y="132"><tspan fill="#7ee787">$</tspan><tspan fill="#e6e6f0" dx="8">whoami</tspan><tspan fill="#4b5563" dx="16">→</tspan><tspan fill="#8b95f0" dx="10" font-weight="bold">Kacper · Blejziak</tspan></text>
    </g>
    <g clip-path="url(#row2)">
      <text x="90" y="164"><tspan fill="#7ee787">$</tspan><tspan fill="#e6e6f0" dx="8">stack</tspan><tspan fill="#4b5563" dx="16">→</tspan><tspan fill="#cdd6f4" dx="10">Java · Node.js · Python · React · TypeScript · Tailwind</tspan></text>
    </g>
    <g clip-path="url(#row3)">
      <text x="90" y="196"><tspan fill="#7ee787">$</tspan><tspan fill="#e6e6f0" dx="8">focus</tspan><tspan fill="#4b5563" dx="16">→</tspan><tspan fill="#cdd6f4" dx="10">boty Discord · strony www · automatyzacje</tspan></text>
    </g>
    <text x="90" y="225" fill="#7ee787" opacity="0.7">$</text>
  </g>

  <!-- migający kursor -->
  <rect x="104" y="212" width="10" height="17" fill="#8b95f0">
    <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.45;0.45;1" dur="1.1s" repeatCount="indefinite"/>
  </rect>
</svg>
